{% extends 'base.html' %} {% load static %} {% block content %}


<div id="myPopup" class="popup-overlay">
  <div class="popup-content">
    <h2>Download</h2>
    <p>This will show you a preview of your ranking before downloading it.</p>

    <button onclick="closePopup()">Close</button>

    <button id="downloadButton">Download Ranking as PNG</button>
    <canvas id="myCanvas" width="500" height="500"></canvas>
  </div>
</div>


<p id="pagetitle">MAKE YOUR TIER LIST</p>
<div id="row-container"></div>

<div id="unassigned">
  <img
    src="{% static 'TierList/blackcrewpng.png' %}"
    alt="My image"
    width="100px"
    id="img1"
    draggable="true"
    ondragstart="dragstartHandler(event)"
  />
  <img
    src="{% static 'TierList/bluecrewpng.png' %}"
    alt="My image"
    width="100px"
    id="img2"
    draggable="true"
    ondragstart="dragstartHandler(event)"
  />
  <img
    src="{% static 'TierList/greencrewpng.png' %}"
    alt="My image"
    width="100px"
    id="img3"
    draggable="true"
    ondragstart="dragstartHandler(event)"
  />
  <img
    src="{% static 'TierList/redcrewpng.png' %}"
    alt="My image"
    width="100px"
    id="img4"
    draggable="true"
    ondragstart="dragstartHandler(event)"
  />
</div>

<input type="file" id="imageUpload" accept="image/*" multiple />
<div id="imagePreview"></div>

<div>
  <button onclick="openPopup()">Download</button>
</div>

<script>
  var ranking = {
    rows: {
      S: [],
      A: [],
      B: [],
      C: [],
      D: [],
      F: []
    },
    unassigned: []
  }

  const container = document.getElementById('row-container')
  //create rows based on ranking.rows keys
  for (const key in ranking.rows) {
    //rows themselves
    const tier_row = document.createElement('div')
    tier_row.id = `row${key}`
    tier_row.className = 'row'

    //left side labels
    const label = document.createElement('div')
    label.id = `label${key}`
    label.className = 'tier-label'
    label.textContent = key

    //dropzones
    const dropzone = document.createElement('div')
    dropzone.id = `dropzone${key}`
    dropzone.addEventListener('drop', dropHandler)
    dropzone.addEventListener('dragover', dragoverHandler)
    dropzone.className = 'drop-zone'

    tier_row.appendChild(label)
    tier_row.appendChild(dropzone)

    container.appendChild(tier_row)
  }

  var selected = null

  function openPopup() {
    document.getElementById('myPopup').style.display =
      'flex' /* Use flex to center content */

    const canvas = document.getElementById('myCanvas')
    const ctx = canvas.getContext('2d')

    // Next step is to make this canvas print out the current ranking
    ctx.fillStyle = 'blue'
    ctx.fillRect(50, 50, 100, 100)

    document
      .getElementById('downloadButton')
      .addEventListener('click', function () {
        const dataURL = canvas.toDataURL('image/png')
        const downloadLink = document.createElement('a')
        downloadLink.href = dataURL
        downloadLink.download = 'my-drawing.png'
        downloadLink.click()
        downloadLink.remove()
      })
  }

  function closePopup() {
    document.getElementById('myPopup').style.display = 'none'
  }

  // Optional: Close the popup when clicking outside the content
  window.onclick = function (event) {
    if (event.target == document.getElementById('myPopup')) {
      document.getElementById('myPopup').style.display = 'none'
    }
  }

  function dragstartHandler(ev) {
    selected = ev.srcElement.src

    // Add the id of the dragged element to the dataTransfer object
    ev.dataTransfer.setData('text/plain', ev.target.id)
    ev.dataTransfer.effectAllowed = 'move' // Optional: specify drag effect
  }

  function dragoverHandler(ev) {
    // Prevent default behavior to allow drop
    ev.preventDefault()
    ev.dataTransfer.dropEffect = 'move' // Optional: specify drop effect
  }

  function dropHandler(ev) {
    ev.preventDefault()
    // Get the id of the dragged element
    const data = ev.dataTransfer.getData('text/plain')
    const draggedElement = document.getElementById(data)

    // Append the dragged element to the drop target
    // Check if the target is a valid drop zone
    if (ev.target.classList.contains('drop-zone')) {
      console.log(ev.target.id)
      console.log(ev.dataTransfer)

      ev.target.appendChild(draggedElement)
      id = ev.target.id.replace('dropzone', '')

      ranking.rows[id.toUpperCase()].push(selected)
      selected = null
    }
  }

  document
    .getElementById('imageUpload')
    .addEventListener('change', function (event) {
      const files = event.target.files
      const imagePreviewDiv = document.getElementById('imagePreview')
      imagePreviewDiv.innerHTML = ''

      if (files.length > 0) {
        Array.from(files).forEach((file, idx) => {
          const reader = new FileReader()
          reader.onload = function (e) {
            // Save base64 string to array
            uploadedImages.push(e.target.result)
            console.log('added to uploadimage', e.target.result)
            // Optionally store in localStorage for persistence
            // localStorage.setItem('uploadedImage_' + idx, e.target.result)

            // Preview image
            const img = document.createElement('img')
            img.src = e.target.result
            img.style.maxWidth = '100%'
            img.style.height = 'auto'
            img.ondragstart = dragstartHandler
            img.draggable = true
            img.id = 'img' + (1000 + idx)
            imagePreviewDiv.appendChild(img)
          }
          reader.readAsDataURL(file)
        })
      } else {
        imagePreviewDiv.innerHTML = ''
      }
    })
</script>
{% endblock %}
