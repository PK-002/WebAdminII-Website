{% extends 'base.html' %} {% load static %} {% block content %}

<div id="myPopup" class="popup-overlay">
  <div class="popup-content">
    <h2>Download</h2>
    <p>This will show you a preview of your ranking before downloading it.</p>

    <button onclick="closePopup()">Close</button>

    <button id="downloadButton">Download Ranking as PNG</button>
    <div id="render"></div>
  </div>
</div>

<p id="pagetitle">MAKE YOUR TIER LIST</p>
<div id="ranking">
  <div id="row-container"></div>
  {% include 'unassigned.html' %}
</div>

<input type="file" id="imageUpload" accept="image/*" multiple />

<div>
  <button onclick="openPopup()">Download</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  var image_count = 0
  var ranking = {
    rows: {
      S: [],
      A: [],
      B: [],
      C: [],
      D: [],
      F: []
    },
    unassigned: []
  }

  const container = document.getElementById('row-container')
  //create rows based on ranking.rows keys
  for (const key in ranking.rows) {
    //rows themselves
    const tier_row = document.createElement('div')
    tier_row.id = `row${key}`
    tier_row.className = 'row'

    //left side labels
    const label = document.createElement('div')
    label.id = `label${key}`
    label.className = 'tier-label'
    label.textContent = key

    //dropzones
    const dropzone = document.createElement("div");
    dropzone.id = `dropzone${key}`;
    dropzone.addEventListener("drop", dropHandler);
    dropzone.addEventListener("dragover", dragoverHandler);
    dropzone.className = "drop-zone";

    //settings
    const settings = document.createElement("div");
    settings.id = `settings${key}`;
    settings.className = "tier-settings";
    settings.addEventListener("click", settingsPopUp)


    tier_row.appendChild(label);
    tier_row.appendChild(dropzone);
    tier_row.appendChild(settings);

    container.appendChild(tier_row);
  }

  var selected = null

  function openPopup() {
    document.getElementById('myPopup').style.display =
      'flex' /* Use flex to center content */

    // May change the function back to this VVV but for now we just need row-container
    // html2canvas(document.querySelector('#render')).then((canvas) => {
    html2canvas(document.querySelector('#row-container')).then((canvas) => {
      const renderDiv = document.querySelector('#render')
      renderDiv.innerHTML = '' // Clear previous content
      renderDiv.appendChild(canvas)

      canvas.style.maxWidth = '100%'
      canvas.style.height = 'auto'

      document
        .getElementById('downloadButton')
        .addEventListener('click', function () {
          const dataURL = canvas.toDataURL('image/png')
          const downloadLink = document.createElement('a')
          downloadLink.href = dataURL
          downloadLink.download = 'my-ranking.png'
          downloadLink.click()
          downloadLink.remove()
        })
    })
  }

  function closePopup() {
    document.getElementById('myPopup').style.display = 'none'
  }

  // Optional: Close the popup when clicking outside the content
  window.onclick = function (event) {
    if (event.target == document.getElementById('myPopup')) {
      document.getElementById('myPopup').style.display = 'none'
    }
  }

  function dragstartHandler(ev) {
    selected = ev.srcElement.src

    // Add the id of the dragged element to the dataTransfer object
    ev.dataTransfer.setData('text/plain', ev.target.id)
    ev.dataTransfer.effectAllowed = 'move' // Optional: specify drag effect
  }

  function dragoverHandler(ev) {
    // Prevent default behavior to allow drop
    ev.preventDefault()
    ev.dataTransfer.dropEffect = 'move' // Optional: specify drop effect
  }

  function dropHandler(ev) {
    ev.preventDefault()
    // Get the id of the dragged element
    const data = ev.dataTransfer.getData('text/plain')
    const draggedElement = document.getElementById(data)

    // Append the dragged element to the drop target
    // Check if the target is a valid drop zone
    if (ev.target.classList.contains('drop-zone')) {
      console.log(ev.target.id)
      console.log(ev.dataTransfer)

      ev.target.appendChild(draggedElement)
      id = ev.target.id.replace('dropzone', '')
      draggedElement.style.width = '100px'
      draggedElement.style.height = '100px'
      
      ranking.rows[id.toUpperCase()].push(selected)
      selected = null

  function settingsPopUp(ev) {
    println('Settings Popup Triggered')

    document.createElement('div');

    const popup = document.getElementById(ev.parentElement.id);
    popup.id = 'popup';

    if (popup.classList.contains('hidden')) {
      // Show popup
      popup.classList.remove('hidden');
      popup.classList.add('visible');

      // Position popup under this element
      const rect = this.getBoundingClientRect();
      popup.style.top = rect.bottom + window.scrollY + 'px';
      popup.style.left = rect.left + window.scrollX + 'px';

    } else {
      // Hide popup
      popup.classList.remove('visible');
      popup.classList.add('hidden');
    }
  }

  function submit_data() {
    if (document.getElementById('unassigned').children.length > 0) {
      for (
        let i = 0;
        i < document.getElementById('unassigned').children.length;
        i++
      ) {
        ranking.unassigned.push(
          document.getElementById('unassigned').children[i].src
        )
      }
    }
  }
</script>
{% endblock %}
